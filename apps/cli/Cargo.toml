[package]
name = "unikvm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "unikvm"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
unikvm-network.workspace = true
unikvm-platform = { workspace = true, features = ["clipboard-monitor"] }
unikvm-protocol.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
unikvm-core.workspace = true
unikvm-platform = { workspace = true, features = ["windows-file-drop"] }

[build-dependencies]
embed-manifest.workspace = true
