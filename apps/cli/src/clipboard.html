<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniKVM Clipboard</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 16px/1.5 Inter, system-ui, sans-serif;
      --background: light-dark(#f1f5f6, #11171c);
      --surface: light-dark(#ffffff, #1b252e);
      --text: light-dark(#192831, #edf4f9);
      --muted: light-dark(#516472, #aebecb);
      --border: light-dark(#dbe5e9, #334754);
      --accent: light-dark(#007769, #58dac5);
      --error: light-dark(#ac3232, #ffa7a4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(24px, 8vw, 80px) 18px;
      background: var(--background);
      color: var(--text);
    }
    main {
      max-width: 34rem;
      margin: auto;
      padding: clamp(18px, 5vw, 32px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
    }
    header { margin-bottom: 24px; }
    h1 { font-size: clamp(1.4rem, 5vw, 1.85rem); letter-spacing: -.045em; margin: 0; }
    h2 { font-size: 1rem; margin: 0; }
    p { margin: 4px 0 0; color: var(--muted); font-size: .875rem; }
    section { padding: 16px 0; border-top: 1px solid var(--border); }
    section:last-child { padding-bottom: 4px; }
    [data-phase="ready"] p { color: var(--accent); }
    [data-phase="failed"] p { color: var(--error); }
    progress {
      display: block;
      appearance: none;
      width: 100%;
      height: 5px;
      margin-top: 12px;
      border: 0;
      border-radius: 6px;
      background: var(--border);
      overflow: hidden;
    }
    progress[hidden] { display: none; }
    progress::-webkit-progress-bar { background: transparent; }
    progress::-webkit-progress-value { background: transparent; }
    progress::-moz-progress-bar { background: transparent; }
    progress:indeterminate {
      background: linear-gradient(90deg, transparent 20%, var(--accent) 50%, transparent 80%)
        no-repeat -120% 0 / 48% 100% var(--border);
      animation: copying 1.25s ease-in-out infinite;
    }
    @keyframes copying { to { background-position: 220% 0; } }
    @media (prefers-reduced-motion: reduce) {
      progress:indeterminate { animation: none; background-position: center; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>UniKVM Clipboard</h1>
      <p id="connection" role="status">Checking the local agent…</p>
    </header>
    <section id="outgoing" aria-labelledby="send-heading">
      <h2 id="send-heading">To the other computer</h2>
      <p role="status">Waiting for a copy</p>
      <progress aria-labelledby="send-heading" hidden></progress>
    </section>
    <section id="incoming" aria-labelledby="receive-heading">
      <h2 id="receive-heading">To this computer</h2>
      <p role="status">Waiting for a copy</p>
      <progress aria-labelledby="receive-heading" hidden></progress>
    </section>
  </main>
  <script>
    const messages = {
      outgoing: { idle: "Waiting for a copy", copying: "Copying to the other computer…",
        ready: "Ready to paste on the other computer", failed: "Copy couldn’t be confirmed",
        skipped: "This clipboard entry was skipped" },
      incoming: { idle: "Waiting for a copy", copying: "Receiving clipboard…",
        ready: "Ready to paste here", failed: "Couldn’t put the copy on this clipboard",
        skipped: "This clipboard entry was skipped" }
    };
    const connection = document.querySelector("#connection");

    function setText(element, text) {
      if (element.textContent !== text) element.textContent = text;
    }

    function render(state) {
      setText(connection, !state.agent ? "Clipboard status unavailable. Check that the updated agent is running." : state.connected
        ? "Paired clipboard connected" : "Clipboard sharing is disconnected or disabled");
      for (const direction of ["outgoing", "incoming"]) {
        const row = document.getElementById(direction);
        const phase = state.agent ? state[direction] : "idle";
        row.dataset.phase = phase;
        row.querySelector("progress").hidden = phase !== "copying";
        setText(row.querySelector("p"), messages[direction][phase]);
      }
    }

    async function refresh() {
      try {
        const response = await fetch("state", { signal: AbortSignal.timeout(4000) });
        if (!response.ok) throw new Error("Status request failed");
        render(await response.json());
      } catch {
        render({ agent: false });
      }
      setTimeout(refresh, 300);
    }
    refresh();
  </script>
</body>
</html>
