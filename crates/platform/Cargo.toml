[package]
name = "unikvm-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempfile.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-graphics.workspace = true
foreign-types.workspace = true
image = { workspace = true, features = ["jpeg", "png", "tiff"] }
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSData", "NSString"] }
unikvm-core.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
image = { workspace = true, features = ["bmp", "png"] }
unikvm-core.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_EventLog",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
unikvm-protocol.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
