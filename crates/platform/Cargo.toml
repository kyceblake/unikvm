[package]
name = "unikvm-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
windows-file-drop = [
    "dep:windows",
    "dep:windows-core",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_System_Ole",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Memory",
    "windows/Win32_System_SystemServices",
]
macos-file-drag = [
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSColor",
    "objc2-app-kit/NSDragging",
    "objc2-app-kit/NSGraphics",
    "objc2-app-kit/NSResponder",
    "objc2-app-kit/NSRunningApplication",
    "objc2-app-kit/NSScreen",
    "objc2-app-kit/NSWindow",
    "objc2-foundation/NSGeometry",
]
file-drag-probe = [
    "windows-file-drop",
    "macos-file-drag",
    "objc2-app-kit/NSDraggingItem",
    "objc2-app-kit/NSDraggingSession",
    "objc2-app-kit/NSEvent",
    "objc2-app-kit/NSImage",
    "objc2-app-kit/NSView",
    "objc2-foundation/NSTimer",
]
clipboard-monitor = [
    "dep:unikvm-protocol",
    "dep:windows",
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSAlert",
    "objc2-app-kit/NSButton",
    "objc2-app-kit/NSColor",
    "objc2-app-kit/NSControl",
    "objc2-app-kit/NSFont",
    "objc2-app-kit/NSEvent",
    "objc2-app-kit/NSImage",
    "objc2-app-kit/NSGraphics",
    "objc2-app-kit/NSProgressIndicator",
    "objc2-app-kit/NSResponder",
    "objc2-app-kit/NSRunningApplication",
    "objc2-app-kit/NSTextField",
    "objc2-app-kit/NSView",
    "objc2-app-kit/NSWindow",
    "objc2-app-kit/NSPanel",
    "objc2-app-kit/NSScreen",
    "objc2-app-kit/NSStatusBar",
    "objc2-app-kit/NSStatusBarButton",
    "objc2-app-kit/NSStatusItem",
    "objc2-app-kit/NSMenu",
    "objc2-app-kit/NSMenuItem",
    "objc2-app-kit/objc2-core-foundation",
    "objc2-foundation/NSDate",
    "objc2-foundation/NSGeometry",
    "objc2-foundation/NSNotification",
    "objc2-foundation/NSTimer",
]

[dependencies]
tempfile.workspace = true
tokio.workspace = true
unikvm-protocol = { workspace = true, optional = true }
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-graphics.workspace = true
foreign-types.workspace = true
image = { workspace = true, features = ["jpeg", "png", "tiff"] }
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }
unikvm-core.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
image = { workspace = true, features = ["bmp", "png"] }
unikvm-core.workspace = true
windows = { workspace = true, optional = true, features = ["Win32_System_Com", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = { workspace = true, optional = true }
windows-sys = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_EventLog",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
unikvm-protocol.workspace = true

[[example]]
name = "file_drag_probe"
required-features = ["file-drag-probe"]

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
