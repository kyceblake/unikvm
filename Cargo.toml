[workspace]
members = [
    "apps/agent",
    "apps/cli",
    "crates/clipboard",
    "crates/config",
    "crates/core",
    "crates/network",
    "crates/platform",
    "crates/protocol",
    "crates/transfer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
rustix = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "signal", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows-sys = "0.61.2"

unikvm-config = { path = "crates/config" }
unikvm-platform = { path = "crates/platform" }
unikvm-protocol = { path = "crates/protocol" }

[workspace.lints.rust]
unsafe_code = "deny"
